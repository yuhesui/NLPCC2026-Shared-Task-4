# Encoder / reranker candidates. NOTHING here is downloaded automatically.
#
# Policy basis (team ruling, 2026-10-03): non-LLM encoders are permitted. A publicly
# available model that runs locally on the team's own machine is acceptable. The organizer's
# LLM list still applies to generative LLMs. Paid / third-party hosted APIs stay excluded.
# See docs/competition/ICAIF_RULES_AND_PROTOCOL.md §6 (Q1, resolved).
#
# status:
#   ready        permitted; runnable once `local_path` points at a manually downloaded, pinned snapshot
#   unsuitable   do not use (language mismatch, paid/hosted, licence)
#   deferred     permitted but postponed (cost/complexity)
# requires_rule_confirmation: true blocks LIVE use (icaif.nlp.embeddings.check_policy) and offline use
# unless allow_unconfirmed_research is set. It stays available for any future ambiguous entry.
# local_path: fill in after a manual, recorded download (model id, revision, licence, weights sha256, date).
# Licences are as published on the model cards; re-check before use.
models:
  lexical_hash_512:
    {family: lexical_baseline, status: ready, requires_rule_confirmation: false, notes: "feature hashing; not a transformer"}
  lexical_entity_v1:
    {family: lexical_baseline, status: ready, requires_rule_confirmation: false, notes: "entity linking relevance"}

  # --- generic open sentence encoders (public, local) ---
  sentence-transformers/all-MiniLM-L6-v2:
    {family: generic_encoder, status: ready, requires_rule_confirmation: false, license: apache-2.0, notes: "fast CPU baseline"}
  BAAI/bge-small-en-v1.5:
    {family: generic_encoder, status: ready, requires_rule_confirmation: false, license: mit,
     notes: "English successor of the NLPCC bge-small-zh choice"}
  BAAI/bge-base-en-v1.5:
    {family: generic_encoder, status: ready, requires_rule_confirmation: false, license: mit}
  intfloat/e5-base-v2:
    {family: generic_encoder, status: ready, requires_rule_confirmation: false, license: mit, notes: "needs 'query:'/'passage:' prefixes"}
  Alibaba-NLP/gte-base-en-v1.5:
    {family: generic_encoder, status: ready, requires_rule_confirmation: false, license: apache-2.0, notes: "trust_remote_code model"}
  nomic-ai/nomic-embed-text-v1.5:
    {family: generic_encoder, status: ready, requires_rule_confirmation: false, license: apache-2.0, notes: "task prefixes; trust_remote_code"}

  # --- rerankers (public, local) ---
  cross-encoder/ms-marco-MiniLM-L-6-v2:
    {family: generic_reranker, status: ready, requires_rule_confirmation: false, license: apache-2.0}
  BAAI/bge-reranker-base:
    {family: generic_reranker, status: ready, requires_rule_confirmation: false, license: mit}

  # --- finance-domain (public, local) ---
  ProsusAI/finbert:
    {family: finance_sentiment, status: ready, requires_rule_confirmation: false,
     notes: "3-class financial tone (FinBERT-style tone baseline from AlphaAllocator, English)"}
  yiyanghkust/finbert-tone:
    {family: finance_sentiment, status: ready, requires_rule_confirmation: false}
  FinLang/finance-embeddings-investopedia:
    {family: finance_encoder, status: ready, requires_rule_confirmation: false,
     notes: "bge-base fine-tuned on finance QA; verify card/licence"}

  # --- LLM-family encoders (public weights, local). Qwen3/Gemma 3 are also on the organizer LLM list. ---
  Qwen/Qwen3-Embedding-0.6B:
    {family: llm_family_encoder, status: ready, requires_rule_confirmation: false, notes: "GPU recommended"}
  Qwen/Qwen3-Reranker-0.6B:
    {family: llm_family_encoder, status: ready, requires_rule_confirmation: false, notes: "cross-encoder reranker"}
  google/embeddinggemma-300m:
    {family: llm_family_encoder, status: ready, requires_rule_confirmation: false, notes: "Gemma licence terms"}
  Qwen/Qwen3-0.6B:
    {family: allowed_llm_as_encoder, status: ready, requires_rule_confirmation: false,
     notes: "mean-pooled hidden states of an organizer-listed LLM; disclose as LLM use"}
  Qwen/Qwen3-Embedding-4B:
    {family: llm_family_encoder, status: deferred, requires_rule_confirmation: false, notes: "cost; after 0.6B"}

  # --- unsuitable ---
  BAAI/bge-small-zh-v1.5:
    {family: legacy_nlpcc, status: unsuitable, requires_rule_confirmation: false, notes: "Chinese; NLPCC legacy"}
  yiyanghkust/finbert-tone-chinese:
    {family: legacy_nlpcc, status: unsuitable, requires_rule_confirmation: false, notes: "Chinese; NLPCC legacy"}
  voyage-finance-2:
    {family: hosted_paid_embedding, status: unsuitable, requires_rule_confirmation: true,
     notes: "paid third-party hosted API; not local"}
  openai/text-embedding-3-large:
    {family: hosted_paid_embedding, status: unsuitable, requires_rule_confirmation: true,
     notes: "paid hosted API, not local, not an organizer-listed LLM"}
