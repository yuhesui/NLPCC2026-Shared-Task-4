# Example local-only model paths for News Overlay transformer methods.
#
# Prompt20 downloads approved Hugging Face models to the user's HF hub cache.
# Do not copy model binaries into this repo or into official runtime packages.

offline: true
local_only: true
device: auto
batch_size: 16
proxy_mode: false

default_hf_hub_cache: "C:\\Users\\jeanna\\.cache\\huggingface\\hub"
approved_models: configs/news_overlay/approved_hf_models.yaml

# Preferred override: set BGE_MODEL_PATH to the resolved snapshot directory.
# Example resolved path after download:
# C:\Users\jeanna\.cache\huggingface\hub\models--BAAI--bge-small-zh-v1.5\snapshots\e534609e6b53ac54bd42d8e87995d21a73b90bad
local_model_paths:
  N2: ${BGE_MODEL_PATH}
  N3: ${BGE_MODEL_PATH}
  N4: ${BGE_MODEL_PATH}
  N5: ${BGE_MODEL_PATH}
  N7: ${BGE_MODEL_PATH}
  N8: ${BGE_MODEL_PATH}
  N12: ${BGE_MODEL_PATH}
  N13: ${BGE_MODEL_PATH}
  N2345: ${BGE_MODEL_PATH}
  I5: ${BGE_MODEL_PATH}
  I6: ${BGE_MODEL_PATH}
  I7: ${BGE_MODEL_PATH}
  I256: ${BGE_MODEL_PATH}
  S6: ${BGE_MODEL_PATH}
  S7: ${BGE_MODEL_PATH}
  S126: ${BGE_MODEL_PATH}
  N6: ${RERANKER_MODEL_PATH}
